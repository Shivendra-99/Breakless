<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>Mock YouTube</title>
<script>
  // What YouTube puts in the page for the first video.
  var ytInitialPlayerResponse = {
    playabilityStatus: { status: 'OK' },
    streamingData: { formats: [1] },
    videoDetails: { videoId: 'test' },
    adPlacements: [{ adPlacementRenderer: { kind: 'AD_PLACEMENT_KIND_START' } }],
    playerAds: [{ x: 1 }],
    adSlots: [{ y: 1 }],
  };
  window.__initialSnapshot = JSON.parse(JSON.stringify(ytInitialPlayerResponse));
</script>
</head>
<body style="margin:0;background:#0f0f0f;color:#fff;font:14px sans-serif">
  <div id="masthead-ad" style="height:40px;background:#333">Masthead ad</div>
  <div id="movie_player" class="html5-video-player" style="position:relative;width:640px;height:360px">
    <div class="html5-video-container">
      <video class="html5-main-video" id="v" src="/video.webm" autoplay playsinline style="width:640px;height:360px"></video>
    </div>
    <div class="ytp-ad-module" id="admod" style="position:absolute;bottom:40px;right:8px"></div>
  </div>
  <div id="feed">
    <ytd-rich-item-renderer id="normalItem" style="display:block;height:60px">A normal video</ytd-rich-item-renderer>
    <ytd-rich-item-renderer id="adItem" style="display:block;height:60px"><ytd-ad-slot-renderer style="display:block">Sponsored</ytd-ad-slot-renderer></ytd-rich-item-renderer>
    <div id="player-ads" style="height:40px">Companion ad</div>
  </div>
  <script>
    const v = document.getElementById('v');
    const player = document.getElementById('movie_player');
    const mod = document.getElementById('admod');
    const fmt = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    window.T = {
      skipClicked: false,
      ad: { done: true },
      shown(id) { const el = document.getElementById(id); return !!el && el.getClientRects().length > 0; },
      state() { return { t: v.currentTime, d: v.duration, muted: v.muted, rate: v.playbackRate, src: v.currentSrc, ad: player.classList.contains('ad-showing') }; },
      // An ad break like YouTube's: the player gets .ad-showing and the same <video> plays the
      // ad clip(s) (30 s each), then goes back to the video at the saved time.
      // opts: count (ads in the break), skipButton, countdown, blockSeek, delaySrc (ms between the
      // .ad-showing class and the ad clip loading).
      startAd(opts = {}) {
        const resumeAt = v.currentTime;
        const count = opts.count || 1;
        T.ad = { done: false, played: 0, count, resumeAt, seeks: 0 };
        player.classList.add('ad-showing', 'ad-interrupting');
        let cd = null, btn = null, iv = 0, lastGood = 0;
        // blockSeek: like a player that snaps back when something jumps ahead in an ad.
        const onTime = () => { if (!T.ad.done && v.currentTime - lastGood < 2) lastGood = v.currentTime; };
        const onSeeking = () => {
          if (T.ad.done) return;
          T.ad.seeks++;
          if (opts.blockSeek && v.currentTime - lastGood > 2) v.currentTime = lastGood;
        };
        const finish = () => {
          clearInterval(iv); cd && cd.remove(); btn && btn.remove();
          v.removeEventListener('ended', next);
          v.removeEventListener('timeupdate', onTime);
          v.removeEventListener('seeking', onSeeking);
          player.classList.remove('ad-showing', 'ad-interrupting');
          v.src = '/video.webm';
          v.addEventListener('loadedmetadata', () => { v.currentTime = resumeAt; v.play(); T.ad.done = true; T.ad.contentBackAt = resumeAt; }, { once: true });
        };
        const next = () => {
          T.ad.played++;
          if (T.ad.played >= count) return finish();
          lastGood = 0;
          v.src = '/ad.webm?n=' + T.ad.played; v.play();
        };
        const begin = () => {
          v.src = '/ad.webm?n=0';
          v.play();
          v.addEventListener('ended', next);
          v.addEventListener('timeupdate', onTime);
          v.addEventListener('seeking', onSeeking);
          if (opts.countdown) {
            cd = document.createElement('span');
            cd.className = 'ytp-ad-duration-remaining';
            mod.appendChild(cd);
          }
          if (opts.skipButton) {
            btn = document.createElement('button');
            btn.className = 'ytp-skip-ad-button';
            btn.textContent = 'Skip';
            btn.style.display = 'none';
            btn.onclick = () => { T.skipClicked = true; finish(); };
            mod.appendChild(btn);
            setTimeout(() => { if (btn) btn.style.display = ''; }, 1000);
          }
          iv = setInterval(() => {
            if (cd && Number.isFinite(v.duration)) cd.textContent = fmt(v.duration - v.currentTime);
          }, 100);
        };
        if (opts.delaySrc) setTimeout(begin, opts.delaySrc); else begin();
        return { resumeAt };
      },
    };
  </script>
</body>
</html>
